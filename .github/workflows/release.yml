name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application bundle
        run: APP_VERSION="${RELEASE_TAG#v}" ./script/build_and_run.sh --build-only

      - name: Package release assets
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Crypto Bubbles Wallpaper.app" \
            "release/CryptoBubblesWallpaper-macos.zip"
          (
            cd release
            shasum -a 256 CryptoBubblesWallpaper-macos.zip \
              > CryptoBubblesWallpaper-macos.zip.sha256
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Crypto Bubbles Wallpaper $RELEASE_TAG" \
              --generate-notes
          fi
